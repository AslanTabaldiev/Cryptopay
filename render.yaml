# Render Blueprint: https://render.com/docs/blueprint-spec
# Один веб-сервис (сайт + API из Dockerfile) и бесплатная база PostgreSQL.
services:
  - type: web
    name: cryptopay
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass # деплой только если GitHub Actions (CI) прошёл
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cryptopay-db
          property: connectionString
      - key: MERCHANT_ADDRESS
        sync: false # публичный адрес магазина из MetaMask (0x...)
      - key: MERCHANT_API_KEY
        sync: false # необязательно; по умолчанию cryptopay-demo-key (ключ показан на сайте)
      - key: API_KEY_REQUIRED
        value: "false" # проверку ключа можно включить переключателем в кабинете
      - key: WEBHOOK_SECRET
        generateValue: true
      - key: WEBHOOK_URL
        sync: false # необязательно; пусто = вебхуки идут во встроенную «Кофейню»
      - key: TELEGRAM_BOT_TOKEN
        sync: false # необязательно: токен бота от @BotFather
      - key: TELEGRAM_CHAT_ID
        sync: false # необязательно: ваш chat_id в Telegram
      - key: RPC_URL
        value: https://ethereum-sepolia-rpc.publicnode.com
      - key: REQUIRED_CONFIRMATIONS
        value: "2"

databases:
  - name: cryptopay-db
    plan: free
    databaseName: cryptopay
    user: cryptopay
